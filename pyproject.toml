[project]
name = "piiscan"
version = "0.1.0"
description = "CPNI OCR Processor: finds where CPNI and other sensitive data live on a file share, on-prem, without storing it."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pypdfium2>=5",
    "pypdf>=5",
    "defusedxml>=0.7",
    "olefile>=0.47",
    "xlrd>=2",
    "striprtf>=0.0.29",
    "extract-msg>=0.55",
    "libpff-python>=20240101",
    "pillow>=11",
    "pillow-heif>=1",
    "pebble>=5",
    "msoffcrypto-tool>=5",
    "cryptography>=42",
    "python-doctr>=1.0",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "sentencepiece>=0.2",
    "faker>=30",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
piiscan = "piiscan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "fpdf2>=2.8",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1",
    "xlwt>=1.3",
]

[tool.uv]
python-preference = "only-managed"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
